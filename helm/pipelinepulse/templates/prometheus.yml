apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/rules/pipelinepulse_alerts.yml

    scrape_configs:
      - job_name: pipelinepulse
        static_configs:
          - targets:
              - collector:8000

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
data:
  pipelinepulse_alerts.yml: |
    groups:
      - name: pipelinepulse_alerts
        rules:
          - alert: PipelineFailureDetected
            expr: increase(pipeline_failure_events_total[5m]) > 0
            for: 0m
            labels:
              severity: critical
              team: devops
            annotations:
              summary: "Pipeline failure detected"
              description: "Pipeline {{ "{{ $labels.pipeline }}" }} on {{ "{{ $labels.provider }}" }} has experienced a new failure."

          - alert: PipelineFailureThresholdExceeded
            expr: increase(pipeline_failure_events_total[1h]) >= 5
            for: 5m
            labels:
              severity: critical
              team: devops
            annotations:
              summary: "Pipeline failure threshold exceeded"
              description: "Pipeline {{ "{{ $labels.pipeline }}" }} on {{ "{{ $labels.provider }}" }} has experienced 5 or more failures in the last hour."

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.prometheus.storage }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: prometheus-rules
              mountPath: /etc/prometheus/rules
            - name: prometheus-storage
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-rules
          configMap:
            name: prometheus-rules
        - name: prometheus-storage
          persistentVolumeClaim:
            claimName: prometheus-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
