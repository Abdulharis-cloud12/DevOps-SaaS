apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: pipelinepulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      containers:
        - name: collector
          image: pipelinepulse-collector:phase10
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          envFrom:
            - secretRef:
                name: pipelinepulse-secrets

          env:
            - name: POSTGRES_HOST
              value: postgres

            - name: JENKINS_URL
              value: http://host.minikube.internal:8080

          readinessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: collector
  namespace: pipelinepulse
spec:
  selector:
    app: collector
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
