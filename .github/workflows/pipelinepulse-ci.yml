name: PipelinePulse CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: |
          pip install ruff
          ruff check .

      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r collector -f txt

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        working-directory: sample-pipeline
        run: |
          python -m unittest discover -s tests

      - name: Build Collector Docker image
        run: |
          docker build \
            -t pipelinepulse-collector:${{ github.sha }} \
            -f docker/collector/Dockerfile .

      - name: Build Discord Adapter Docker image
        run: |
          docker build \
            -t pipelinepulse-discord-adapter:${{ github.sha }} \
            -f docker/discord-adapter/Dockerfile .

      - name: Scan Collector image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pipelinepulse-collector:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Scan Discord Adapter image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'pipelinepulse-discord-adapter:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: |
          helm lint helm/pipelinepulse

      - name: Render Helm templates
        run: |
          helm template pipelinepulse helm/pipelinepulse \
            --namespace pipelinepulse
